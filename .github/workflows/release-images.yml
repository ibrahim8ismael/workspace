name: CI/CD main deployment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gather-lite-production
  cancel-in-progress: false

jobs:
  release_and_deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_OWNER: ${{ github.repository_owner }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: api-runtime
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gather-lite-api:${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=gather-lite-api
          cache-to: type=gha,mode=max,scope=gather-lite-api

      - name: Publish worker image
        id: worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: worker-runtime
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gather-lite-worker:${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=gather-lite-worker
          cache-to: type=gha,mode=max,scope=gather-lite-worker

      - name: Publish media guard image
        id: media_guard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: media-guard-runtime
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gather-lite-media-guard:${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=gather-lite-media-guard
          cache-to: type=gha,mode=max,scope=gather-lite-media-guard

      - name: Publish pilot web image
        id: web_pilot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: web-runtime
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gather-lite-web:${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          build-args: |
            VITE_PROXIMITY_VOICE_ENABLED=true
            CADDYFILE=infra/deploy/Caddyfile
          cache-from: type=gha,scope=gather-lite-web-pilot
          cache-to: type=gha,mode=max,scope=gather-lite-web-pilot

      - name: Publish core web image
        id: web_core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: web-runtime
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gather-lite-web-core:${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          build-args: |
            VITE_PROXIMITY_VOICE_ENABLED=false
            CADDYFILE=infra/deploy/Caddyfile
          cache-from: type=gha,scope=gather-lite-web-core
          cache-to: type=gha,mode=max,scope=gather-lite-web-core

      - name: Create deployment image manifest
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          MEDIA_GUARD_DIGEST: ${{ steps.media_guard.outputs.digest }}
          WEB_PILOT_DIGEST: ${{ steps.web_pilot.outputs.digest }}
          WEB_CORE_DIGEST: ${{ steps.web_core.outputs.digest }}
        run: |
          test -n "$API_DIGEST"
          test -n "$WORKER_DIGEST"
          test -n "$MEDIA_GUARD_DIGEST"
          test -n "$WEB_PILOT_DIGEST"
          test -n "$WEB_CORE_DIGEST"
          cat > release-images.env <<EOF
          GATHER_API_IMAGE=ghcr.io/${IMAGE_OWNER}/gather-lite-api@${API_DIGEST}
          GATHER_WORKER_IMAGE=ghcr.io/${IMAGE_OWNER}/gather-lite-worker@${WORKER_DIGEST}
          GATHER_MEDIA_GUARD_IMAGE=ghcr.io/${IMAGE_OWNER}/gather-lite-media-guard@${MEDIA_GUARD_DIGEST}
          GATHER_WEB_IMAGE=ghcr.io/${IMAGE_OWNER}/gather-lite-web@${WEB_PILOT_DIGEST}
          GATHER_WEB_CORE_IMAGE=ghcr.io/${IMAGE_OWNER}/gather-lite-web-core@${WEB_CORE_DIGEST}
          EOF
          {
            echo "### Container images published"
            echo
            echo "CI passed for commit `${RELEASE_SHA}`. Images carry the commit SHA tag; the manifest pins their immutable registry digests."
            echo "Download `release-images.env` from this workflow run to promote those digest-pinned references."
            echo "The following workflow step deploys this release to the configured VPS and restores the previous image references if health checks fail."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: gather-lite-images-${{ github.event.workflow_run.head_sha }}
          path: release-images.env
          if-no-files-found: error
          retention-days: 90

      - name: Deploy release to the production VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing Actions secret VPS_HOST}"
          : "${VPS_USER:?Missing Actions secret VPS_USER}"
          : "${VPS_SSH_KEY:?Missing Actions secret VPS_SSH_KEY}"
          : "${GHCR_TOKEN:?Missing workflow package token}"
          [[ "$VPS_USER" =~ ^[A-Za-z0-9_.-]+$ ]]

          ssh_dir="$RUNNER_TEMP/gather-vps-ssh"
          install -d -m 700 "$ssh_dir"
          key_file="$ssh_dir/deploy_key"
          known_hosts="$ssh_dir/known_hosts"
          trap 'rm -f -- "$key_file" "$known_hosts"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$key_file"
          chmod 600 "$key_file"
          if ! ssh-keyscan -T 10 -H "$VPS_HOST" > "$known_hosts" 2>/dev/null || [[ ! -s "$known_hosts" ]]; then
            echo 'Could not establish the VPS SSH host key.' >&2
            exit 1
          fi

          target="$VPS_USER@$VPS_HOST"
          ssh_options=(-i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts" -o ConnectTimeout=20)
          remote_dir="$(ssh "${ssh_options[@]}" "$target" "set -eu; d=\"\$HOME/.cache/gather-lite-deploy/$RELEASE_SHA\"; install -d -m 700 \"\$d\"; printf '%s' \"\$d\"")"
          scp "${ssh_options[@]}" infra/deploy/rollout-release.sh "$target:$remote_dir/rollout-release.sh"
          scp "${ssh_options[@]}" release-images.env "$target:$remote_dir/release-images.env"

          printf '%s\n' "$GHCR_TOKEN" | ssh "${ssh_options[@]}" "$target" \
            "bash \"\$HOME/.cache/gather-lite-deploy/$RELEASE_SHA/rollout-release.sh\" \"\$HOME/.cache/gather-lite-deploy/$RELEASE_SHA/release-images.env\" '$RELEASE_SHA' '$GHCR_USER'"
          {
            echo
            echo "Production deployment passed service and public HTTPS health checks for `${RELEASE_SHA}`."
          } >> "$GITHUB_STEP_SUMMARY"
