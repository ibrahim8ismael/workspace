name: gather-lite-pilot

services:
  mongo:
    image: mongo:8.2.6@sha256:9690b268c50317b2988a7f84f514a2cdcf4de6836e12c295b48f3a203731fce1
    command: [mongod, --replSet, rs0, --bind_ip_all]
    healthcheck:
      test:
        [
          CMD,
          mongosh,
          --quiet,
          mongodb://127.0.0.1:27017/admin,
          --eval,
          'if (db.adminCommand({ping: 1}).ok !== 1) quit(1)',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - mongo-data:/data/db
    networks: [data]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  mongo-init:
    image: mongo:8.2.6@sha256:9690b268c50317b2988a7f84f514a2cdcf4de6836e12c295b48f3a203731fce1
    profiles: [setup]
    entrypoint: [mongosh, mongodb://mongo:27017/admin, --quiet, --file, /scripts/init-replica.js]
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ../mongodb/init-replica.js:/scripts/init-replica.js:ro
    networks: [data]
    restart: 'no'

  indexes:
    image: ${GATHER_API_IMAGE:?set GATHER_API_IMAGE in infra/deploy/.env}
    build:
      context: ../..
      dockerfile: infra/Dockerfile
      target: api-runtime
    profiles: [setup]
    env_file: [./api.env]
    environment:
      NODE_ENV: production
    command: [node, apps/api/dist/platform/database/create-indexes.js]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    networks: [data]
    restart: 'no'
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  redis-queue:
    image: redis:8.2.3-alpine@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
    command:
      [
        redis-server,
        --appendonly,
        'yes',
        --appendfsync,
        everysec,
        --maxmemory,
        256mb,
        --maxmemory-policy,
        noeviction,
        --protected-mode,
        'no',
      ]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - queue-data:/data
    networks: [data]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M

  api:
    image: ${GATHER_API_IMAGE:?set GATHER_API_IMAGE in infra/deploy/.env}
    build:
      context: ../..
      dockerfile: infra/Dockerfile
      target: api-runtime
    env_file: [./api.env]
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: '3000'
      APP_ORIGIN: https://${APP_DOMAIN:?set APP_DOMAIN in infra/deploy/.env}
      DB_AUTO_INDEX: 'false'
      REDIS_QUEUE_URL: redis://redis-queue:6379
      LIVEKIT_URL: ''
      LIVEKIT_API_KEY: ''
      LIVEKIT_API_SECRET: ''
      MEDIA_MACHINE_KEY: ''
    depends_on:
      mongo:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    expose: ['3000']
    healthcheck:
      test:
        [
          CMD,
          node,
          --input-type=module,
          -e,
          "fetch('http://127.0.0.1:3000/api/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [edge, data]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  caddy:
    image: ${GATHER_WEB_IMAGE:?set GATHER_WEB_IMAGE in infra/deploy/.env}
    build:
      context: ../..
      dockerfile: infra/Dockerfile
      target: web-runtime
      args:
        VITE_PROXIMITY_VOICE_ENABLED: 'false'
        CADDYFILE: infra/deploy/Caddyfile
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in infra/deploy/.env}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:${GATHER_WEB_BIND_PORT:-18443}:8443
    healthcheck:
      test:
        [
          CMD-SHELL,
          'curl --fail --silent --show-error --insecure --output /dev/null https://localhost:8443/ && curl --fail --silent --show-error --insecure --output /dev/null https://localhost:8443/api/health/live',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge, host-access]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  worker:
    image: ${GATHER_WORKER_IMAGE:?set GATHER_WORKER_IMAGE in infra/deploy/.env}
    build:
      context: ../..
      dockerfile: infra/Dockerfile
      target: worker-runtime
    profiles: [mail]
    env_file: [./worker.env]
    environment:
      NODE_ENV: production
      REDIS_QUEUE_URL: redis://redis-queue:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    networks: [data, egress]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

networks:
  edge:
    internal: true
  data:
    internal: true
  egress:
    driver: bridge
  host-access:
    driver: bridge

volumes:
  mongo-data:
  queue-data:
  caddy-data:
  caddy-config:
